        <label class="sr-only" for="t-search">Search models</label>
        <input type="search" id="t-search" placeholder="Search models or AI labs" data-label-ph="tableSearch">
        <label class="sr-only" for="t-origin">AI lab origin</label>

        <label class="sr-only" for="t-weights">Open or closed</label>

          <table class="board" id="board">

                <th scope="col" data-key="developer"><button type="button" data-label="thDeveloper">AI lab</button></th>
                <th scope="col" data-key="weights"><button type="button" data-label="thWeights">Weights</button></th>
                <th scope="col" data-key="success" class="bar-cell"><button type="button" data-label="thSuccess">Refactoring success</button></th>
                <th scope="col" data-key="generation" class="bar-cell"><button type="button" data-label="thReturned">File returned</button></th>
                <th scope="col" data-key="effort"><button type="button" data-label="thEffort">Avg. effort (h)</button></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="more-row" id="more-row"><button type="button" class="bare-btn btn-ghost" id="t-more"></button></div>
